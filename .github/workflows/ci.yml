name: ci

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Free, deterministic quality gate: no LLM calls, fails the build on a retrieval regression.
      - run: ragwb eval-retrieval -k 4 --min-recall 0.95
