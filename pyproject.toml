[project]
name = "ragwb"
version = "0.1.0"
description = "RAG + Evaluation Workbench: chunking/embedding comparison, citation-grounded answers, measured quality and cost."
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.7",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "anthropic>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ragwb = "ragwb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
